apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky
  namespace: tasky
---
# INTENTIONAL WEAKNESS: the app's identity is cluster-admin across the whole cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: tasky
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
